backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "artigos"
    label: "Artigos"
    folder: "artigos"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Título"
        name: "title"
        widget: "string"

      - label: "Data"
        name: "date"
        widget: "datetime"

      - label: "Imagem de capa"
        name: "image"
        widget: "image"
        required: false

      - label: "Conteúdo"
        name: "body"
        widget: "markdown"
